<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muniko Share</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --accent: #2563eb; --border: #dde1e7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #181c22; --text: #e8ebef; --muted: #99a3b0; --accent: #6ea0ff; --border: #2a3039; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { width: 100%; max-width: 480px; padding: 32px 24px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  p { margin: 0 0 24px; color: var(--muted); }
  .downloads { display: grid; gap: 10px; }
  a { display: block; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; }
  a.match { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Muniko Share</h1>
  <p>Muniko Share is a desktop app for Windows, macOS and Linux. Install it to send files and share your clipboard over your local network.</p>
  <div class="downloads">
    <a data-os="windows" href="{{RELEASES_URL}}">Download for Windows</a>
    <a data-os="mac" href="{{RELEASES_URL}}">Download for macOS</a>
    <a data-os="linux" href="{{RELEASES_URL}}">Download for Linux</a>
  </div>
</main>
<script>
  (function () {
    var ua = navigator.userAgent;
    var os = /Windows/i.test(ua) ? "windows" : /Mac/i.test(ua) ? "mac" : /Linux|X11/i.test(ua) ? "linux" : "";
    var match = document.querySelector('[data-os="' + os + '"]');
    if (match) match.className = "match";
  })();
</script>
</body>
</html>
