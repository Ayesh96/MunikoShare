[package]
name = "muniko-core"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Internal-Use-1.0.0"
license-file = "../../LICENSE"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
async-trait = "0.1.92"
axum = "0.8.9"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
mdns-sd = "0.21.6"
percent-encoding = "2.3.2"
png = "0.18.1"
rand = "0.10.3"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json"] }
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", default-features = false }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "v7"] }
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
